<!DOCTYPE html>
<html lang="ja">
<head>

<script>
(function () {
  function validEntry() {
    try {
      var token = sessionStorage.getItem("blueTempleEntryToken");
      var ts = Number(sessionStorage.getItem("blueTempleEntryTime") || "0");
      return token === "ok" && ts > 0 && (Date.now() - ts) < 30000;
    } catch (e) {
      return false;
    }
  }

  if (!validEntry()) {
    window.location.replace("./index.html?v=14");
    return;
  }

  try {
    sessionStorage.removeItem("blueTempleEntryToken");
    sessionStorage.removeItem("blueTempleEntryTime");
  } catch (e) {}

  window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
      window.location.replace("./index.html?v=14");
    }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=15">
<title>そんな貴方に!</title>

<style>
/* v15: CTA横並びをHTML側でも強制。古いCSSキャッシュが残っても崩れない */

.actionButtons .actionButton{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-width:0!important;min-height:62px!important;margin:0!important;padding:10px 8px!important;background:#fff!important;color:#141414!important;border:3px solid #141414!important;border-radius:20px!important;box-shadow:5px 5px 0 #141414!important;text-decoration:none!important;text-align:center!important;font-weight:900!important;font-size:clamp(.82rem,3.55vw,1rem)!important;line-height:1.15!important;letter-spacing:0!important;white-space:normal!important}
.shop__info--after-actions{margin-top:10px!important;padding-top:10px!important;border-top:3px solid #141414!important;order:initial!important}
.shop__info--after-actions .shop__info-row{padding:10px 0 0!important;border-bottom:0!important;align-items:center!important}
@media(max-width:360px){.actionButtons{gap:9px!important}.actionButtons .actionButton{min-height:56px!important;padding-inline:5px!important;font-size:.78rem!important}}

</head>
<body>

    <div class="shop__photo shop__photo--compact" id="shopPhoto">

      <span class="shop__photo-placeholder" style="display:none;">店舗写真</span>
